name: Build iOS and Submit to TestFlight

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS and Submit to TestFlight
    runs-on: macos-15
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: "Setup Xcode"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: "Install Project Dependencies"
        run: |
          npm install
          npm install -g eas-cli

      - name: "Configure Sandbox Environment & Bypasses"
        run: |
          # 1. Prevent SPM Rate Limiting & SSH Hangs
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"
          
          # 2. Inject Sandbox Variables into eas.json
          node -e "
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build = eas.build || {};
          eas.build.production = eas.build.production || {};
          eas.build.production.env = eas.build.production.env || {};
          
          // User traps bypasses
          eas.build.production.env.EXPO_USE_SPM = '0';
          eas.build.production.env.ENABLE_USER_SCRIPT_SANDBOXING = 'NO';
          
          // Disable Mac Silicon and Catalyst validation
          eas.build.production.env.SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = 'NO';
          eas.build.production.env.SUPPORTS_MACCATALYST = 'NO';
          eas.build.production.env.TARGETED_DEVICE_FAMILY = '1';

          // Give Xcode the exact absolute path to Node.js
          eas.build.production.env.NODE_BINARY = process.execPath;
          eas.build.production.env.EXPO_DEBUG = '1';
          
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2));
          console.log('Successfully injected build-from-source flags into eas.json');
          "

      - name: "Build iOS Locally on Free Runner (Zero EAS Credits)"
        run: EAS_NO_VCS=1 eas build --platform ios --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}

      - name: "Upload Expo Build Log"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expo-build-log
          path: /tmp/expo_build.log

      - name: "Submit to App Store Connect"
        run: |
          IPA_FILE=$(find . -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ]; then
            echo "Found IPA: $IPA_FILE. Submitting to TestFlight..."
            npx eas submit --platform ios --path "$IPA_FILE" --non-interactive --verbose || \
            (echo "Apple App Store Connect transient issue, retrying in 20 seconds..." && sleep 20 && npx eas submit --platform ios --path "$IPA_FILE" --non-interactive --verbose)
          else
            echo "No IPA file found to submit."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}

      - name: "Save .ipa File"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-iOS
          path: '*.ipa'
